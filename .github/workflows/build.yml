name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      SOLUTION: PeripheralBatteryMonitor.sln
      CONFIGURATION: Release
      OUTPUT_DIR: src/PeripheralBatteryMonitor.App/bin/Release/net48

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Both projects are SDK-style; Microsoft.NETFramework.ReferenceAssemblies
      # supplies the net48 reference assemblies, so no MSBuild/nuget.exe setup and
      # no targeting pack are needed.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Compute version from git
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # Tag builds carry a real version derived from the tag.
            $describe = git describe --tags --long --match 'v*' 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $describe) {
              $version = "0.0.0.0"
            } elseif ($describe -match '^v(\d+\.\d+\.\d+)-(\d+)-g[0-9a-f]+$') {
              $version = "{0}.{1}" -f $matches[1], $matches[2]
            } else {
              $version = "0.0.0.0"
            }
          } else {
            # master / manual builds are unreleased -> pin to 0.0.0.0.
            $version = "0.0.0.0"
          }
          Write-Host "Computed version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore $env:SOLUTION

      # There is no AssemblyInfo.cs to patch any more -- the SDK generates the
      # assembly attributes, so the version is passed in as a property. The Settings
      # form prints AssemblyVersion, which is why all three are set.
      - name: Build
        run: >
          dotnet build $env:SOLUTION
          -c $env:CONFIGURATION
          --no-restore
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -p:Version=${{ steps.version.outputs.version }}

      # PeripheralBatteryMonitor.Core.dll is embedded in the exe by the
      # EmbedReferencedAssemblies target, so the output folder must hold exactly one
      # executable and nothing else. Catching a regression here is cheaper than
      # shipping a release that needs a DLL beside it.
      - name: Verify single-file output
        shell: pwsh
        run: |
          $stray = Get-ChildItem $env:OUTPUT_DIR -File |
                   Where-Object { $_.Extension -notin '.exe', '.pdb' }
          if ($stray) {
            Write-Host "::error::Unexpected files beside the exe: $($stray.Name -join ', ')"
            exit 1
          }
          Get-ChildItem $env:OUTPUT_DIR -File | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: PeripheralBatteryMonitor-${{ steps.version.outputs.version }}
          path: ${{ env.OUTPUT_DIR }}/PeripheralBatteryMonitor.exe
          if-no-files-found: error

      - name: Draft GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.OUTPUT_DIR }}/PeripheralBatteryMonitor.exe
